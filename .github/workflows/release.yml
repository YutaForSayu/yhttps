name: release

# Tag-driven. Manual runs only build and stash artifacts; they never touch a
# release, and the release job never clobbers an existing release body.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux + Windows. zig acts as the cross C/linker compiler, which is what
  # lets ring (and therefore TLS) cross-compile.
  build-posix:
    name: build linux + windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu"

      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64

      - name: Install zig
        run: |
          set -euo pipefail
          url=$(curl -s https://ziglang.org/download/index.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          vs=[k for k in d if k!='master']
          def key(v):
              try: return tuple(int(x) for x in v.split('.'))
              except Exception: return (0,)
          vs.sort(key=key, reverse=True)
          for v in vs:
              t=d[v].get('x86_64-linux')
              if t: print(t['tarball']); break
          ")
          curl -sSL "$url" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: bash scripts/release-matrix.sh dist

      - name: Collect bare binaries
        run: bash scripts/collect-binaries.sh

      - uses: actions/upload-artifact@v4
        with:
          name: yhtps-posix
          path: dist/yhtps-*

  # Apple targets need a real macOS SDK: from Linux, zig cannot resolve
  # `-framework CoreFoundation`, so these must be built natively.
  build-macos:
    name: build macos (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: bash scripts/release-matrix.sh dist

      - name: Collect bare binaries
        run: bash scripts/collect-binaries.sh

      - uses: actions/upload-artifact@v4
        with:
          name: yhtps-${{ matrix.target }}
          path: dist/yhtps-*

  release:
    name: attach assets to the release
    needs: [build-posix, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: yhtps-*
          merge-multiple: true
          path: dist

      - name: Recompute checksums over the full set
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum yhtps-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%p\n' | sort)
          printf 'uploading:\n'; printf '  %s\n' "${assets[@]}"
          gh release upload "$tag" "${assets[@]}" --clobber
          gh release view "$tag" --json tagName,assets \
            --jq '.tagName, (.assets[] | "  \(.name)  \(.size) bytes")'