[package]
name = "yhtps"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "YhHTTPServer — a zero-config static & framework HTTP server (npm http-server + serve style), written in Rust."
license = "MIT"
readme = "README.md"
keywords = ["http", "server", "static", "dev-server", "serve"]
categories = ["command-line-utilities", "web-programming::http-server"]
authors = ["YhHTTPServer contributors"]

[[bin]]
name = "yhtps"
path = "src/main.rs"

[features]
default = ["tls"]
tls = [
  "dep:rustls",
  "dep:tokio-rustls",
  "dep:rustls-pemfile",
  "dep:rcgen",
]

[dependencies]
anyhow = "1.0"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli"] }
bytes = "1.6"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
httpdate = "1.0"
hyper = { version = "1.4", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = [
  "tokio",
  "server",
  "server-auto",
  "http1",
  "http2",
  "client",
  "client-legacy",
] }
local-ip-address = "0.6"
mime_guess = "2.0"
percent-encoding = "2.3"
tokio = { version = "1.40", features = [
  "rt-multi-thread",
  "net",
  "fs",
  "io-util",
  "macros",
  "signal",
  "time",
  "sync",
] }
tokio-util = { version = "0.7", features = ["io", "rt"] }

# --- TLS (optional, enabled by the default `tls` feature) ---
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
], optional = true }
rustls-pemfile = { version = "2.1", optional = true }
rcgen = { version = "0.13", default-features = false, features = [
  "pem",
  "ring",
], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
